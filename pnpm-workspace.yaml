minimumReleaseAge: 10080
trustPolicy: no-downgrade
# semver@6.3.1 is a transitive dep via @babel/*. It was published on
# 2023-07-10 without a provenance attestation, right after semver
# 7.5.4 (2023-07-07) shipped with one, so pnpm >=11's lockfile
# trust verification flags it as a downgrade. Exclude only this
# version; the policy stays on for everything else.
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
